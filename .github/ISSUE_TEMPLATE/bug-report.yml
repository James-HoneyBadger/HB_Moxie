name: Bug Report
description: Report a bug in HB Moxie
body:
  - type: checkboxes
    id: checkboxes
    attributes:
      label: Before You Submit
      description: Please check whether the following items have been completed.
      options:
        - label: I've already checked that this bug hasn't been raised in [issues](https://github.com/James-HoneyBadger/HB_Moxie/issues)
          required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Please provide a brief description of this bug.
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: Please describe the steps to reproduce this bug.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: hbmoxie-version
    attributes:
      label: HB Moxie Version
      description: HB Moxie version and commit hash of your instance, e.g. "v1.0.0 (20e2444)"
    validations:
      required: true

  - type: input
    id: server-os
    attributes:
      label: Server Operating System
      description: The operating system information you are using to deploy HB Moxie, e.g "Debian GNU/Linux 11 amd64"

  - type: input
    id: server-database
    attributes:
      label: Database
      description: The database system you are using, e.g. "MariaDB v11.7.2"

  - type: dropdown
    id: reproduce-on-demo-site
    attributes:
      label: Can you reproduce this bug on a fresh HB Moxie instance?
      description: |
        HB Moxie repository: https://github.com/James-HoneyBadger/HB_Moxie
      options:
        - "No"
        - "Yes"
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional information
      description: If you can, provide any related screenshots or logs here.