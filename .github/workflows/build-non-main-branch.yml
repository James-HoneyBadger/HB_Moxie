name: Build for Non-Main Branches

on:
  push:
    branches-ignore:
      - main

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      build-unix-time: ${{ steps.variable.outputs.build_unix_time }}
      build-date: ${{ steps.variable.outputs.build_date }}
      hbmoxie-package-file-name-prefix: ${{ steps.variable.outputs.hbmoxie_package_file_name_prefix }}
      hbmoxie-package-artifact-name-prefix: ${{ steps.variable.outputs.hbmoxie_package_artifact_name_prefix }}
      hbmoxie-backend-artifact-name-prefix: ${{ steps.variable.outputs.hbmoxie_backend_artifact_name_prefix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up variables
        id: variable
        run: |
          echo "build_unix_time=$(date '+%s')" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date '+%Y%m%d')" >> "$GITHUB_OUTPUT"
          echo "hbmoxie_package_file_name_prefix=hbmoxie-dev-package-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          echo "hbmoxie_package_artifact_name_prefix=hbmoxie-build-dev-package-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          echo "hbmoxie_backend_artifact_name_prefix=hbmoxie-build-dev-backend-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

  build-linux-package:
    runs-on: ubuntu-24.04
    needs:
      - setup
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/build-linux-package
        with:
          build-unix-time: ${{ needs.setup.outputs.build-unix-time }}
          build-date: ${{ needs.setup.outputs.build-date }}
          check-3rd-api: ${{ vars.CHECK_3RD_API }}
          skip-tests: ${{ vars.SKIP_TESTS }}
          platform-name: linux-amd64
          package-file-name-prefix: ${{ needs.setup.outputs.hbmoxie-package-file-name-prefix }}
          package-artifact-name-prefix: ${{ needs.setup.outputs.hbmoxie-package-artifact-name-prefix }}

  build-windows-backend:
    needs:
      - setup
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/build-windows-backend
        with:
          build-unix-time: ${{ needs.setup.outputs.build-unix-time }}
          build-date: ${{ needs.setup.outputs.build-date }}
          check-3rd-api: ${{ vars.CHECK_3RD_API }}
          skip-tests: ${{ vars.SKIP_TESTS }}
          backend-artifact-name-prefix: ${{ needs.setup.outputs.hbmoxie-backend-artifact-name-prefix }}

  build-windows-package:
    needs:
      - setup
      - build-windows-backend
      - build-linux-package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/build-windows-package
        with:
          package-file-name-prefix: ${{ needs.setup.outputs.hbmoxie-package-file-name-prefix }}
          package-artifact-name-prefix: ${{ needs.setup.outputs.hbmoxie-package-artifact-name-prefix }}
          backend-artifact-name-prefix: ${{ needs.setup.outputs.hbmoxie-backend-artifact-name-prefix }}
