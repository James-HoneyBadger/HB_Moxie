name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pin the newest supported Go release line. `go-version-file: go.mod` only
  # resolves the minimum version (1.25), which no longer receives security fixes.
  GO_VERSION: "1.27.x"

jobs:
  backend:
    name: Backend (format, vet, test, build)
    runs-on: ubuntu-24.04
    env:
      BUILD_PIPELINE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l ./cmd ./pkg ./admin ./main.go ./umask_unix.go ./umask_windows.go)"
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Verify generated OpenAPI and TypeScript models
        run: go run ./cmd/openapi --check

      - name: Build backend
        run: go build -trimpath -o /tmp/ratel-ledger .

      - name: Unit tests
        run: go test -short -race ./...

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint and type-check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Syntax-check Electron entry points
        run: |
          node --check electron/main.js
          node --check electron/preload.js

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Building govulncheck from source with the configured toolchain keeps it
      # in sync with GOROOT; a stale binary cannot parse a newer standard library.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan for known vulnerabilities
        run: govulncheck ./...
