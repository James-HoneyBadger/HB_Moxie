# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pin the newest supported Go release line. `go-version-file: go.mod` only
  # resolves the minimum version (1.25), which no longer receives security fixes.
  GO_VERSION: "1.27.x"

jobs:
  backend:
    name: Backend (format, vet, test, build)
    runs-on: ubuntu-24.04
    env:
      BUILD_PIPELINE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l ./cmd ./pkg ./admin ./main.go ./umask_unix.go ./umask_windows.go)"
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Verify generated OpenAPI and TypeScript models
        run: go run ./cmd/openapi --check

      - name: Build backend
        run: go build -trimpath -o /tmp/honey-ledger .

      - name: Unit tests
        run: go test -short -race ./...

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint and type-check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Syntax-check Electron entry points
        run: |
          node --check electron/main.js
          node --check electron/preload.js
          node --check electron/userDataLayout.js

      - name: Test the user data migration
        run: node --test electron/userDataLayout.test.js

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Building govulncheck from source with the configured toolchain keeps it
      # in sync with GOROOT; a stale binary cannot parse a newer standard library.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan for known vulnerabilities
        run: govulncheck ./...

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check brand consistency
        run: node scripts/check-brand.mjs

      - name: Check locale key parity
        run: node scripts/check-locales.mjs

      - name: Check for telemetry and analytics endpoints
        run: ./scripts/check-no-telemetry.sh

  admin:
    name: Admin tool (build, vet, test)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: admin/go.sum

      # Fyne links against OpenGL plus both the X11 and Wayland backends.
      - name: Install Fyne build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Check formatting
        working-directory: admin
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: admin
        run: go vet ./...

      - name: Unit tests
        working-directory: admin
        run: go test ./...

      - name: Build
        working-directory: admin
        run: go build -o /tmp/honey-ledger-admin .

      - name: Vulnerability scan
        working-directory: admin
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
