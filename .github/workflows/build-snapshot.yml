name: Build Snapshot

on:
  push:
    branches:
      - main

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      build-unix-time: ${{ steps.variable.outputs.build_unix_time }}
      build-date: ${{ steps.variable.outputs.build_date }}
      honey_ledger_package_file_name_prefix: ${{ steps.variable.outputs.honey_ledger_package_file_name_prefix }}
      honey_ledger_package_artifact_name_prefix: ${{ steps.variable.outputs.honey_ledger_package_artifact_name_prefix }}
      honey_ledger_backend_artifact_name_prefix: ${{ steps.variable.outputs.honey_ledger_backend_artifact_name_prefix }}
      honey_ledger_electron_artifact_name_prefix: ${{ steps.variable.outputs.honey_ledger_electron_artifact_name_prefix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up variables
        id: variable
        run: |
          echo "build_unix_time=$(date '+%s')" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date '+%Y%m%d')" >> "$GITHUB_OUTPUT"
          echo "honey_ledger_package_file_name_prefix=honey-ledger-dev-package-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          echo "honey_ledger_package_artifact_name_prefix=honey-ledger-build-dev-package-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          echo "honey_ledger_backend_artifact_name_prefix=honey-ledger-build-dev-backend-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          echo "honey_ledger_electron_artifact_name_prefix=honey-ledger-build-dev-electron-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

  build-linux-package:
    runs-on: ubuntu-24.04
    needs:
      - setup
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/build-linux-package
        with:
          build-unix-time: ${{ needs.setup.outputs.build-unix-time }}
          build-date: ${{ needs.setup.outputs.build-date }}
          check-3rd-api: ${{ vars.CHECK_3RD_API }}
          skip-tests: ${{ vars.SKIP_TESTS }}
          platform-name: linux-amd64
          package-file-name-prefix: ${{ needs.setup.outputs.honey_ledger_package_file_name_prefix }}
          package-artifact-name-prefix: ${{ needs.setup.outputs.honey_ledger_package_artifact_name_prefix }}

  build-windows-backend:
    needs:
      - setup
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/build-windows-backend
        with:
          build-unix-time: ${{ needs.setup.outputs.build-unix-time }}
          build-date: ${{ needs.setup.outputs.build-date }}
          check-3rd-api: ${{ vars.CHECK_3RD_API }}
          skip-tests: ${{ vars.SKIP_TESTS }}
          backend-artifact-name-prefix: ${{ needs.setup.outputs.honey_ledger_backend_artifact_name_prefix }}

  build-windows-package:
    needs:
      - setup
      - build-windows-backend
      - build-linux-package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/build-windows-package
        with:
          package-file-name-prefix: ${{ needs.setup.outputs.honey_ledger_package_file_name_prefix }}
          package-artifact-name-prefix: ${{ needs.setup.outputs.honey_ledger_package_artifact_name_prefix }}
          backend-artifact-name-prefix: ${{ needs.setup.outputs.honey_ledger_backend_artifact_name_prefix }}

  build-electron:
    needs:
      - setup
    uses: ./.github/workflows/build-electron.yml
    with:
      release-build: "0"
      build-unix-time: ${{ needs.setup.outputs.build-unix-time }}
      build-date: ${{ needs.setup.outputs.build-date }}
      artifact-prefix: ${{ needs.setup.outputs.honey_ledger_electron_artifact_name_prefix }}
      check-3rd-api: ${{ vars.CHECK_3RD_API }}
      skip-tests: ${{ vars.SKIP_TESTS }}
