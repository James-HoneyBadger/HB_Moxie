name: Build Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      build-unix-time: ${{ steps.variable.outputs.build_unix_time }}
      build-date: ${{ steps.variable.outputs.build_date }}
      ratel_ledger_package_file_name_prefix: ${{ steps.variable.outputs.ratel_ledger_package_file_name_prefix }}
      ratel_ledger_package_artifact_name_prefix: ${{ steps.variable.outputs.ratel_ledger_package_artifact_name_prefix }}
      ratel_ledger_backend_artifact_name_prefix: ${{ steps.variable.outputs.ratel_ledger_backend_artifact_name_prefix }}
      ratel_ledger_electron_artifact_name_prefix: ${{ steps.variable.outputs.ratel_ledger_electron_artifact_name_prefix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up variables
        id: variable
        run: |
          echo "build_unix_time=$(date '+%s')" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date '+%Y%m%d')" >> "$GITHUB_OUTPUT"
          echo "ratel_ledger_package_file_name_prefix=ratel-ledger-${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "ratel_ledger_package_artifact_name_prefix=ratel-ledger-build-release-package-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          echo "ratel_ledger_backend_artifact_name_prefix=ratel-ledger-build-release-backend-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          echo "ratel_ledger_electron_artifact_name_prefix=ratel-ledger-build-release-electron-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

  build-linux-package:
    runs-on: ubuntu-24.04
    needs:
      - setup
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/build-linux-package
        with:
          release-build: 1
          build-unix-time: ${{ needs.setup.outputs.build-unix-time }}
          build-date: ${{ needs.setup.outputs.build-date }}
          check-3rd-api: ${{ vars.CHECK_3RD_API }}
          skip-tests: ${{ vars.SKIP_TESTS }}
          platform-name: linux-amd64
          package-file-name-prefix: ${{ needs.setup.outputs.ratel_ledger_package_file_name_prefix }}
          package-artifact-name-prefix: ${{ needs.setup.outputs.ratel_ledger_package_artifact_name_prefix }}

  build-windows-backend:
    needs:
      - setup
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/build-windows-backend
        with:
          release-build: 1
          build-unix-time: ${{ needs.setup.outputs.build-unix-time }}
          build-date: ${{ needs.setup.outputs.build-date }}
          check-3rd-api: ${{ vars.CHECK_3RD_API }}
          skip-tests: ${{ vars.SKIP_TESTS }}
          backend-artifact-name-prefix: ${{ needs.setup.outputs.ratel_ledger_backend_artifact_name_prefix }}

  build-windows-package:
    needs:
      - setup
      - build-windows-backend
      - build-linux-package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/build-windows-package
        with:
          package-file-name-prefix: ${{ needs.setup.outputs.ratel_ledger_package_file_name_prefix }}
          package-artifact-name-prefix: ${{ needs.setup.outputs.ratel_ledger_package_artifact_name_prefix }}
          backend-artifact-name-prefix: ${{ needs.setup.outputs.ratel_ledger_backend_artifact_name_prefix }}

  verify-openapi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.7"

      - name: Verify generated OpenAPI and TypeScript models
        run: go run ./cmd/openapi --check

      - name: Test the generator
        run: go test ./cmd/openapi

  build-electron:
    needs:
      - setup
    uses: ./.github/workflows/build-electron.yml
    with:
      release-build: "1"
      build-unix-time: ${{ needs.setup.outputs.build-unix-time }}
      build-date: ${{ needs.setup.outputs.build-date }}
      artifact-prefix: ${{ needs.setup.outputs.ratel_ledger_electron_artifact_name_prefix }}
      check-3rd-api: ${{ vars.CHECK_3RD_API }}
      skip-tests: ${{ vars.SKIP_TESTS }}

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - setup
      - build-linux-package
      - build-windows-package
      - build-electron
      - verify-openapi
    steps:
      - name: Download all packaged files
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.setup.outputs.ratel_ledger_package_artifact_name_prefix }}-*
          merge-multiple: true
          path: release-files

      - name: Download Electron packages
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.setup.outputs.ratel_ledger_electron_artifact_name_prefix }}-*
          merge-multiple: true
          path: release-files

      - name: Publish Release ${{ github.ref_name }}
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: ./release-files/*
          draft: true
