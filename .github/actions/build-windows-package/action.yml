name: Build packages for windows
description: Packages the Windows desktop application

inputs:
  package-file-name-prefix:
    description: Prefix for the package file name
    required: true
  package-artifact-name-prefix:
    description: Prefix for the package artifact name
    required: true
  backend-artifact-name-prefix:
    description: Prefix for the backend artifact name
    required: true

runs:
  using: "composite"
  steps:
    - name: Download windows-x64 backend file
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.backend-artifact-name-prefix }}-windows-x64
        path: ${{ runner.temp }}\backend

    - name: Download linux-amd64 packaged files
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.package-artifact-name-prefix }}-linux-amd64
        path: ${{ runner.temp }}\package

    - name: Extract frontend files from linux-amd64 package
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path package
        tar -xzf (Get-ChildItem ${{ runner.temp }}\package\${{ inputs.package-file-name-prefix }}-linux-amd64.tar.gz) -C package

    - name: Package windows-x64 package
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path "hbmoxie"
        New-Item -ItemType Directory -Path "hbmoxie\data"
        New-Item -ItemType Directory -Path "hbmoxie\storage"
        New-Item -ItemType Directory -Path "hbmoxie\log"
        Copy-Item ${{ runner.temp }}\backend\hbmoxie.exe -Destination hbmoxie\
        Copy-Item -Recurse -Force package\public -Destination hbmoxie\public
        Copy-Item -Recurse -Force conf -Destination hbmoxie\conf
        Copy-Item -Recurse -Force templates -Destination hbmoxie\templates
        Copy-Item .\LICENSE -Destination hbmoxie\
        Push-Location hbmoxie
        7z a -r -tzip -mx9 ..\${{ inputs.package-file-name-prefix }}-windows-x64.zip *
        Pop-Location
        Remove-Item -Recurse -Force hbmoxie

    - name: Upload windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.package-artifact-name-prefix }}-windows-x64
        path: ${{ inputs.package-file-name-prefix }}-windows-x64.zip
        if-no-files-found: error
